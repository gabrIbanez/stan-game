# Production : app Next.js + PostgreSQL + volumes pour les médias uploadés.
# Usage : cp .env.production.example .env.production && docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build

services:
  app:
    build: .
    container_name: stan-game-app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-stan_game}?schema=public
      NODE_ENV: production
    volumes:
      - stan_game_uploads_audio:/app/public/audio
      - stan_game_uploads_video:/app/public/video
      - stan_game_uploads_images:/app/public/images
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: stan-game-db-prod
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Définissez POSTGRES_PASSWORD dans .env.production}
      POSTGRES_DB: ${POSTGRES_DB:-stan_game}
    volumes:
      - stan_game_pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-stan_game}",
        ]
      interval: 5s
      timeout: 5s
      retries: 8
      start_period: 10s

volumes:
  stan_game_pgdata:
  stan_game_uploads_audio:
  stan_game_uploads_video:
  stan_game_uploads_images:
