services:
  postgres:
    image: postgres:16-alpine
    container_name: stan-game-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: stan_game
    volumes:
      - stan_game_pgdata:/var/lib/postgresql/data

volumes:
  stan_game_pgdata:
